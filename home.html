<script>

/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let currentProfile = null;

let selectedFile = null;


/* =====================================================
   START
===================================================== */

async function startHome(){

    try{


        /* GET LOGGED-IN USER */

        const result =
            await supabase.auth.getUser();


        if(
            result.error ||
            !result.data ||
            !result.data.user
        ){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            result.data.user;


        console.log(
            "Current user:",
            currentUser.id
        );


        /* LOAD PROFILE */

        const profileResult =
            await supabase
            .from("profiles")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


        if(profileResult.error){

            console.log(
                "Profile error:",
                profileResult.error
            );

        }


        currentProfile =
            profileResult.data;


        /* SHOW PROFILE */

        if(currentProfile){

            const avatar =
                currentProfile.avatar_url ||
                "https://via.placeholder.com/100";


            document
            .getElementById("myAvatar")
            .src = avatar;


            document
            .getElementById("headerAvatar")
            .src = avatar;


            document
            .getElementById("headerName")
            .textContent =
                currentProfile.full_name ||
                "Profile";

        }


        /* LOAD STORIES */

        await loadStories();


        /* LOAD FEED */

        await loadFeed();


    }catch(error){

        console.error(error);

        alert(
            "Home error: " +
            error.message
        );

    }

}


/* =====================================================
   NAVIGATION
===================================================== */

function goHome(){

    window.location.href =
        "index.html";

}


function goMyProfile(){

    window.location.href =
        "profile.html";

}


/* =====================================================
   OPEN MOMENT
===================================================== */

function openMoment(){

    const form =
        document.getElementById(
            "postForm"
        );


    form.style.display =
        "block";


    document
    .getElementById("caption")
    .focus();


    form.scrollIntoView({

        behavior:"smooth",

        block:"center"

    });

}


/* =====================================================
   SELECT VIDEO
===================================================== */

function selectVideo(){

    const input =
        document.getElementById(
            "videoInput"
        );


    input.value = "";

    input.click();

}


/* =====================================================
   SELECT PHOTO
===================================================== */

function selectPhoto(){

    const input =
        document.getElementById(
            "photoInput"
        );


    input.value = "";

    input.click();

}


/* =====================================================
   VIDEO SELECTED
===================================================== */

document
.getElementById("videoInput")
.addEventListener(
    "change",
    function(){

        if(
            this.files &&
            this.files[0]
        ){

            selectedFile =
                this.files[0];


            showFile();

        }

    }
);


/* =====================================================
   PHOTO SELECTED
===================================================== */

document
.getElementById("photoInput")
.addEventListener(
    "change",
    function(){

        if(
            this.files &&
            this.files[0]
        ){

            selectedFile =
                this.files[0];


            showFile();

        }

    }
);


/* =====================================================
   SHOW FILE
===================================================== */

function showFile(){

    openMoment();


    document
    .getElementById("selectedFile")
    .textContent =
        "Selected: " +
        selectedFile.name;

}


/* =====================================================
   PUBLISH MOMENT
===================================================== */

async function publishMoment(){


    /* GET USER AGAIN */

    const userResult =
        await supabase.auth.getUser();


    if(
        userResult.error ||
        !userResult.data ||
        !userResult.data.user
    ){

        alert(
            "Please login again."
        );

        window.location.href =
            "login.html";

        return;

    }


    const user =
        userResult.data.user;


    /* GET TEXT */

    const caption =
        document
        .getElementById("caption")
        .value
        .trim();


    /* CHECK */

    if(
        !caption &&
        !selectedFile
    ){

        alert(
            "Write a moment or select a photo/video."
        );

        return;

    }


    const button =
        document.getElementById(
            "publishButton"
        );


    button.disabled = true;

    button.textContent =
        "Publishing...";


    try{


        let mediaUrl = null;

        let mediaType = null;


        /* =========================================
           UPLOAD MEDIA
        ========================================= */

        if(selectedFile){


            /* CHECK FILE */

            if(
                !selectedFile.type.startsWith(
                    "image/"
                ) &&
                !selectedFile.type.startsWith(
                    "video/"
                )
            ){

                throw new Error(
                    "Only photos and videos are allowed."
                );

            }


            /* TYPE */

            mediaType =
                selectedFile.type.startsWith(
                    "video/"
                )
                ?
                "video"
                :
                "image";


            /* EXTENSION */

            const extension =
                selectedFile.name
                .split(".")
                .pop()
                .toLowerCase();


            /* FILE PATH */

            const filePath =
                user.id +
                "/" +
                Date.now() +
                "_" +
                Math.random()
                .toString(36)
                .substring(2) +
                "." +
                extension;


            /* UPLOAD */

            const upload =
                await supabase.storage
                .from("post-media")
                .upload(
                    filePath,
                    selectedFile,
                    {
                        cacheControl:
                            "3600",

                        upsert:
                            false
                    }
                );


            if(upload.error){

                throw new Error(
                    "Upload failed: " +
                    upload.error.message
                );

            }


            /* GET URL */

            const publicUrl =
                supabase.storage
                .from("post-media")
                .getPublicUrl(
                    filePath
                );


            mediaUrl =
                publicUrl.data.publicUrl;

        }


        /* =========================================
           SAVE POST
        ========================================= */

        const insert =
            await supabase
            .from("posts")
            .insert({

                user_id:
                    user.id,

                caption:
                    caption || null,

                media_url:
                    mediaUrl,

                media_type:
                    mediaType

            });


        if(insert.error){

            throw new Error(
                "Database error: " +
                insert.error.message
            );

        }


        /* RESET */

        document
        .getElementById("caption")
        .value = "";


        document
        .getElementById("selectedFile")
        .textContent = "";


        document
        .getElementById("videoInput")
        .value = "";


        document
        .getElementById("photoInput")
        .value = "";


        selectedFile = null;


        document
        .getElementById("postForm")
        .style.display =
            "none";


        /* REFRESH FEED */

        await loadFeed();


        alert(
            "Moment published successfully!"
        );


    }catch(error){

        console.error(error);


        alert(
            "Moment failed: " +
            error.message
        );


    }finally{

        button.disabled = false;

        button.textContent =
            "Publish Moment";

    }

}


/* =====================================================
   LOAD FEED
===================================================== */

async function loadFeed(){

    const feed =
        document.getElementById(
            "feed"
        );


    feed.innerHTML =
        `
        <div class="loading">
            Loading moments...
        </div>
        `;


    const result =
        await supabase
        .from("posts")
        .select(`
            id,
            user_id,
            caption,
            media_url,
            media_type,
            created_at,
            profiles(
                id,
                full_name,
                avatar_url
            )
        `)
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(result.error){

        console.error(result.error);


        feed.innerHTML =
            `
            <div class="loading">

                Unable to load moments.

                <br><br>

                ${escapeHTML(
                    result.error.message
                )}

            </div>
            `;

        return;

    }


    feed.innerHTML = "";


    if(
        !result.data ||
        result.data.length === 0
    ){

        feed.innerHTML =
            `
            <div class="loading">

                No moments yet.

                <br><br>

                Be the first person to share!

            </div>
            `;

        return;

    }


    result.data.forEach(
        function(post){

            createPost(post);

        }
    );

}


/* =====================================================
   CREATE POST
===================================================== */

function createPost(post){

    const profile =
        post.profiles || {};


    const name =
        profile.full_name ||
        "SeBa User";


    const avatar =
        profile.avatar_url ||
        "https://via.placeholder.com/100";


    const element =
        document.createElement(
            "article"
        );


    element.className =
        "post";


    let mediaHTML = "";


    /* VIDEO */

    if(
        post.media_url &&
        post.media_type === "video"
    ){

        mediaHTML =
            `
            <video
                class="post-video"
                controls
                playsinline
                preload="metadata"
            >

                <source
                    src="${post.media_url}"
                >

                Your browser does not support video.

            </video>
            `;

    }


    /* IMAGE */

    else if(
        post.media_url &&
        post.media_type === "image"
    ){

        mediaHTML =
            `
            <img
                class="post-image"
                src="${post.media_url}"
                alt="Moment"
                loading="lazy"
            >
            `;

    }


    element.innerHTML = `

        <div class="post-header">


            <img
                class="post-avatar"
                src="${avatar}"
                onclick="openProfile('${post.user_id}')"
            >


            <div
                class="post-user"
                onclick="openProfile('${post.user_id}')"
            >

                <div class="post-user-name">

                    ${escapeHTML(name)}

                </div>


                <span class="post-time">

                    ${formatDate(
                        post.created_at
                    )}

                </span>

            </div>


        </div>


        ${
            post.caption
            ?
            `
            <div class="post-text">

                ${escapeHTML(
                    post.caption
                )}

            </div>
            `
            :
            ""
        }


        ${mediaHTML}


        <div class="post-actions">


            <button
                onclick="likePost(${post.id})"
            >
                ❤️ Like
            </button>


            <button
                onclick="focusComment(${post.id})"
            >
                💬 Comment
            </button>


            <button
                onclick="sharePost(${post.id})"
            >
                ↗️ Share
            </button>


        </div>


        <div class="comment-form">


            <input
                id="comment-${post.id}"
                placeholder="Write a comment..."
            >


            <button
                onclick="addComment(${post.id})"
            >
                Send
            </button>


        </div>


        <div
            class="comments"
            id="comments-${post.id}"
        ></div>

    `;


    document
    .getElementById("feed")
    .appendChild(element);


    loadComments(
        post.id
    );

}


/* =====================================================
   OPEN PROFILE
===================================================== */

function openProfile(userId){

    window.location.href =
        "profile.html?id=" +
        encodeURIComponent(userId);

}


/* =====================================================
   COMMENTS
===================================================== */

function focusComment(postId){

    const input =
        document.getElementById(
            "comment-" + postId
        );


    if(input){

        input.focus();

    }

}


async function addComment(postId){

    const userResult =
        await supabase.auth.getUser();


    if(
        userResult.error ||
        !userResult.data ||
        !userResult.data.user
    ){

        alert(
            "Please login again."
        );

        return;

    }


    const input =
        document.getElementById(
            "comment-" + postId
        );


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    const result =
        await supabase
        .from("comments")
        .insert({

            post_id:
                postId,

            user_id:
                userResult.data.user.id,

            comment:
                text

        });


    if(result.error){

        alert(
            "Comment failed: " +
            result.error.message
        );

        return;

    }


    input.value = "";


    await loadComments(
        postId
    );

}


/* =====================================================
   LOAD COMMENTS
===================================================== */

async function loadComments(postId){

    const box =
        document.getElementById(
            "comments-" + postId
        );


    if(!box){

        return;

    }


    const result =
        await supabase
        .from("comments")
        .select(`
            id,
            comment,
            created_at,
            profiles(
                full_name
            )
        `)
        .eq(
            "post_id",
            postId
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(result.error){

        console.log(
            result.error
        );

        return;

    }


    box.innerHTML = "";


    result.data.forEach(
        function(comment){

            const name =
                comment.profiles?.full_name ||
                "User";


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "comment";


            div.innerHTML = `

                <strong>

                    ${escapeHTML(name)}

                </strong>

                <br>

                ${escapeHTML(
                    comment.comment
                )}

            `;


            box.appendChild(div);

        }
    );

}


/* =====================================================
   LIKE
===================================================== */

async function likePost(postId){

    const userResult =
        await supabase.auth.getUser();


    if(
        userResult.error ||
        !userResult.data ||
        !userResult.data.user
    ){

        alert(
            "Please login again."
        );

        return;

    }


    const userId =
        userResult.data.user.id;


    const existing =
        await supabase
        .from("likes")
        .select("id")
        .eq(
            "post_id",
            postId
        )
        .eq(
            "user_id",
            userId
        )
        .maybeSingle();


    if(existing.error){

        alert(
            existing.error.message
        );

        return;

    }


    if(existing.data){

        await supabase
        .from("likes")
        .delete()
        .eq(
            "id",
            existing.data.id
        );

    }else{

        const result =
            await supabase
            .from("likes")
            .insert({

                post_id:
                    postId,

                user_id:
                    userId

            });


        if(result.error){

            alert(
                result.error.message
            );

        }

    }

}


/* =====================================================
   SHARE
===================================================== */

async function sharePost(postId){

    const url =
        window.location.origin +
        window.location.pathname +
        "#post-" +
        postId;


    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    "SeBa.sl Moment",

                text:
                    "Check this moment on SeBa.sl",

                url:
                    url

            });

        }else{

            await navigator
            .clipboard
            .writeText(url);


            alert(
                "Moment link copied!"
            );

        }

    }catch(error){

        console.log(
            "Share cancelled."
        );

    }

}


/* =====================================================
   STORIES
===================================================== */

async function loadStories(){

    const container =
        document.getElementById(
            "stories"
        );


    container.innerHTML = "";


    /* YOUR STORY */

    const ownStory =
        document.createElement(
            "div"
        );


    ownStory.className =
        "story";


    const ownAvatar =
        currentProfile?.avatar_url ||
        "https://via.placeholder.com/200";


    ownStory.innerHTML = `

        <img
            class="story-background"
            src="${ownAvatar}"
        >


        <img
            class="story-avatar"
            src="${ownAvatar}"
        >


        <div class="story-name">

            Your Story

        </div>

    `;


    ownStory.onclick =
        function(){

            goMyProfile();

        };


    container.appendChild(
        ownStory
    );


    /* OTHER USERS */

    const result =
        await supabase
        .from("profiles")
        .select(
            "id,full_name,avatar_url"
        )
        .limit(15);


    if(result.error){

        console.log(
            result.error
        );

        return;

    }


    result.data.forEach(
        function(profile){

            if(
                profile.id ===
                currentUser.id
            ){

                return;

            }


            const story =
                document.createElement(
                    "div"
                );


            story.className =
                "story";


            const avatar =
                profile.avatar_url ||
                "https://via.placeholder.com/200";


            story.innerHTML = `

                <img
                    class="story-background"
                    src="${avatar}"
                >


                <img
                    class="story-avatar"
                    src="${avatar}"
                >


                <div class="story-name">

                    ${escapeHTML(
                        profile.full_name ||
                        "User"
                    )}

                </div>

            `;


            story.onclick =
                function(){

                    openProfile(
                        profile.id
                    );

                };


            container.appendChild(
                story
            );

        }
    );

}


/* =====================================================
   SEARCH
===================================================== */

document
.getElementById("searchInput")
.addEventListener(
    "input",
    function(){

        const search =
            this.value
            .toLowerCase()
            .trim();


        document
        .querySelectorAll(".post")
        .forEach(
            function(post){

                const text =
                    post.innerText
                    .toLowerCase();


                post.style.display =
                    text.includes(search)
                    ?
                    "block"
                    :
                    "none";

            }
        );

    }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text || "";


    return div.innerHTML;

}


/* =====================================================
   DATE
===================================================== */

function formatDate(date){

    return new Date(date)
    .toLocaleString();

}

   START APPLICATION

startHome();
