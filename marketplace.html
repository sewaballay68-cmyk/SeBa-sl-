<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SeBa.sl Marketplace</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        /* HEADER */

        header {
            background: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #ddd;
        }

        .header {
            max-width: 1100px;
            margin: auto;
            padding: 12px 15px;

            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #d90000;
        }

        .search {
            flex: 1;
        }

        .search input {
            width: 100%;
            padding: 12px 18px;
            border: none;
            background: #f0f2f5;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }

        .cart-button {
            position: relative;
            border: none;
            background: #f0f2f5;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 21px;
            cursor: pointer;
        }

        #cartCount {
            position: absolute;
            top: -3px;
            right: -2px;
            background: red;
            color: white;
            font-size: 11px;
            min-width: 19px;
            height: 19px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-button {
            border: none;
            background: white;
            font-size: 25px;
            cursor: pointer;
        }

        /* NAVIGATION */

        .navigation {
            max-width: 1100px;
            margin: auto;
            padding: 0 15px 12px;

            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .navigation a {
            text-decoration: none;
            color: #333;
            background: #f0f2f5;
            padding: 8px 15px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .navigation a.active {
            background: #d90000;
            color: white;
        }

        /* MAIN */

        main {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* HERO */

        .hero {
            background: linear-gradient(
                135deg,
                #d90000,
                #850000
            );

            color: white;
            border-radius: 18px;
            padding: 35px 25px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .hero p {
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .sell-button {
            border: none;
            background: white;
            color: #d90000;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* FILTERS */

        .filters {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;

            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        select {
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }

        /* PRODUCTS */

        .products {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px;
        }

        .product {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);

            transition: transform .2s;
        }

        .product:hover {
            transform: translateY(-3px);
        }

        .product-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background: #eee;
        }

        .product-body {
            padding: 13px;
        }

        .category {
            color: #777;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .product-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 7px;
        }

        .price {
            color: #d90000;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .location {
            color: #777;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .product-buttons {
            display: flex;
            gap: 6px;
        }

        .product-buttons button {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .cart-btn {
            background: #eee;
        }

        .buy-btn {
            background: #d90000;
            color: white;
        }

        .favorite {
            background: white !important;
            border: 1px solid #ddd !important;
            flex: 0 0 40px !important;
        }

        /* SELL FORM */

        .sell-section {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .sell-section.active {
            display: block;
        }

        .sell-section h2 {
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .publish {
            width: 100%;
            padding: 13px;
            border: none;
            background: #d90000;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        /* CART */

        .cart-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            max-width: 90%;
            height: 100%;
            background: white;
            z-index: 3000;

            box-shadow:
                -5px 0 20px rgba(0,0,0,.2);

            transition: right .3s;
            padding: 20px;
            overflow-y: auto;
        }

        .cart-panel.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-cart {
            border: none;
            background: none;
            font-size: 25px;
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 7px;
        }

        .cart-item-info {
            flex: 1;
        }

        .remove-cart {
            border: none;
            background: none;
            color: red;
            cursor: pointer;
        }

        .cart-total {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
        }

        .checkout {
            width: 100%;
            padding: 13px;
            border: none;
            background: #d90000;
            color: white;
            border-radius: 8px;
            font-weight: bold;
        }

        /* OVERLAY */

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 2000;
        }

        .overlay.show {
            display: block;
        }

        /* EMPTY */

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            color: #777;
        }

        /* MOBILE */

        @media(max-width:600px) {

            .header {
                flex-wrap: wrap;
            }

            .logo {
                font-size: 21px;
            }

            .search {
                order: 3;
                flex-basis: 100%;
            }

            .hero h1 {
                font-size: 25px;
            }

            .products {
                grid-template-columns:
                    repeat(2, 1fr);
                gap: 10px;
            }

            .product-image {
                height: 160px;
            }

            .product-body {
                padding: 9px;
            }

            .product-name {
                font-size: 14px;
            }

            .price {
                font-size: 15px;
            }
        }

    </style>
</head>


<body>


<!-- HEADER -->

<header>

    <div class="header">

        <div class="logo">
            SeBa.sl
        </div>

        <div class="search">

            <input
                type="search"
                id="searchInput"
                placeholder="Search products..."
                oninput="searchProducts()"
            >

        </div>

        <button
            class="cart-button"
            onclick="openCart()"
        >
            🛒
            <span id="cartCount">0</span>
        </button>

        <button
            class="menu-button"
            onclick="toggleNavigation()"
        >
            ☰
        </button>

    </div>


    <nav
        class="navigation"
        id="navigation"
    >

        <a href="Home.html">
            🏠 Home
        </a>

        <a
            href="marketplace.html"
            class="active"
        >
            🛒 Marketplace
        </a>

        <a href="profile.html">
            👤 Profile
        </a>

        <a href="about.html">
            ℹ️ About
        </a>
<a href="service.html">Our Services</a>
    </nav>

</header>


<!-- MAIN -->

<main>


    <!-- HERO -->

    <section class="hero">

        <h1>
            SeBa.sl Marketplace
        </h1>

        <p>
            Buy and sell products, discover local businesses,
            and connect with customers across Sierra Leone.
        </p>

        <button
            class="sell-button"
            onclick="toggleSellForm()"
        >
            ➕ Sell Something
        </button>

    </section>


    <!-- SELL FORM -->

    <section
        class="sell-section"
        id="sellSection"
    >

        <h2>
            Create a Product
        </h2>

        <div class="form-group">

            <label>
                Product Name
            </label>

            <input
                id="productName"
                type="text"
                placeholder="Example: Samsung Phone"
            >

        </div>


        <div class="form-group">

            <label>
                Category
            </label>

            <select id="productCategory">

                <option>
                    Electronics
                </option>

                <option>
                    Fashion
                </option>

                <option>
                    Vehicles
                </option>

                <option>
                    Phones
                </option>

                <option>
                    Home
                </option>

                <option>
                    Food
                </option>

                <option>
                    Services
                </option>

                <option>
                    Other
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Price
            </label>

            <input
                id="productPrice"
                type="number"
                placeholder="Enter price"
            >

        </div>


        <div class="form-group">

            <label>
                Currency
            </label>

            <select id="productCurrency">

                <option value="SLE">
                    🇸🇱 SLE
                </option>

                <option value="USD">
                    🇺🇸 USD
                </option>

                <option value="GHS">
                    🇬🇭 GHS
                </option>

                <option value="NGN">
                    🇳🇬 NGN
                </option>

                <option value="GBP">
                    🇬🇧 GBP
                </option>

                <option value="EUR">
                    🇪🇺 EUR
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Location
            </label>

            <input
                id="productLocation"
                type="text"
                placeholder="Example: Freetown"
            >

        </div>


        <div class="form-group">

            <label>
                Product Image URL
            </label>

            <input
                id="productImage"
                type="url"
                placeholder="Paste image URL"
            >

        </div>


        <div class="form-group">

            <label>
                Description
            </label>

            <textarea
                id="productDescription"
                placeholder="Describe your product..."
            ></textarea>

        </div>


        <button
            class="publish"
            onclick="publishProduct()"
        >
            Publish Product
        </button>

    </section>


    <!-- FILTER -->

    <section class="filters">

        <select
            id="categoryFilter"
            onchange="filterProducts()"
        >

            <option value="all">
                All Categories
            </option>

            <option value="Electronics">
                Electronics
            </option>

            <option value="Fashion">
                Fashion
            </option>

            <option value="Vehicles">
                Vehicles
            </option>

            <option value="Phones">
                Phones
            </option>

            <option value="Home">
                Home
            </option>

            <option value="Food">
                Food
            </option>

            <option value="Services">
                Services
            </option>

        </select>


        <select
            id="currencySelector"
            onchange="changeCurrency()"
        >

            <option value="SLE">
                🇸🇱 SLE
            </option>

            <option value="USD">
                🇺🇸 USD
            </option>

            <option value="GHS">
                🇬🇭 GHS
            </option>

            <option value="NGN">
                🇳🇬 NGN
            </option>

            <option value="GBP">
                🇬🇧 GBP
            </option>

            <option value="EUR">
                🇪🇺 EUR
            </option>

        </select>

    </section>


    <!-- PRODUCTS -->

    <section
        class="products"
        id="products"
    >

    </section>

</main>


<!-- CART OVERLAY -->

<div
    class="overlay"
    id="overlay"
    onclick="closeCart()"
></div>


<!-- CART -->

<aside
    class="cart-panel"
    id="cartPanel"
>

    <div class="cart-header">

        <h2>
            🛒 Your Cart
        </h2>

        <button
            class="close-cart"
            onclick="closeCart()"
        >
            ×
        </button>

    </div>


    <div id="cartItems">

    </div>


    <div
        class="cart-total"
        id="cartTotal"
    >
        Total: SLE 0
    </div>


    <button
        class="checkout"
        onclick="checkout()"
    >
        Continue to Checkout
    </button>

</aside>


<script>

/* =====================================
   SEBA.SL MARKETPLACE
===================================== */


/*
    DEMO PRODUCTS

    Later these will come from Supabase.
*/

let products = [

    {
        id: 1,

        name: "Samsung Galaxy Phone",

        category: "Phones",

        price: 3500,

        currency: "SLE",

        location: "Freetown",

        image:
        "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9",

        description:
        "Good condition smartphone."
    },


    {
        id: 2,

        name: "Men's Fashion Shoes",

        category: "Fashion",

        price: 1200,

        currency: "SLE",

        location: "Lumley",

        image:
        "https://images.unsplash.com/photo-1542291026-7eec264c27ff",

        description:
        "Quality men's shoes."
    },


    {
        id: 3,

        name: "Laptop Computer",

        category: "Electronics",

        price: 650,

        currency: "USD",

        location: "Freetown",

        image:
        "https://images.unsplash.com/photo-1496181133206-80ce9b88a853",

        description:
        "Laptop suitable for business and school."
    },


    {
        id: 4,

        name: "Modern Sofa",

        category: "Home",

        price: 4500,

        currency: "SLE",

        location: "Western Area",

        image:
        "https://images.unsplash.com/photo-1555041469-a586c61ea9bc",

        description:
        "Comfortable modern sofa."
    }

];


/*
    CURRENCY SETTINGS

    These are example conversion
    values for the frontend demo.

    For a live marketplace, we can
    connect this to a live exchange-rate
    service later.
*/

const currencyRates = {

    SLE: 1,

    USD: 0.000045,

    GHS: 0.00068,

    NGN: 0.071,

    GBP: 0.000035,

    EUR: 0.000041

};


const currencySymbols = {

    SLE: "SLE",

    USD: "$",

    GHS: "GH₵",

    NGN: "₦",

    GBP: "£",

    EUR: "€"

};


let selectedCurrency = "SLE";


let cart =
    JSON.parse(
        localStorage.getItem("sebaCart")
    ) || [];


/* =====================================
   DISPLAY PRODUCTS
===================================== */

function displayProducts(list = products) {

    const container =
        document.getElementById("products");


    container.innerHTML = "";


    if (list.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <h3>No products found</h3>
                <p>Try another search or category.</p>
            </div>
        `;

        return;

    }


    list.forEach(product => {

        const card =
            document.createElement("article");

        card.className = "product";


        const converted =
            convertPrice(
                product.price,
                product.currency,
                selectedCurrency
            );


        card.innerHTML = `

            <img
                class="product-image"
                src="${product.image}"
                alt="${product.name}"
                loading="lazy"
            >


            <div class="product-body">

                <div class="category">
                    ${product.category}
                </div>


                <div class="product-name">
                    ${escapeHTML(product.name)}
                </div>


                <div class="price">

                    ${currencySymbols[selectedCurrency]}
                    ${converted.toLocaleString(
                        undefined,
                        {
                            maximumFractionDigits: 2
                        }
                    )}

                </div>


                <div class="location">
                    📍 ${escapeHTML(product.location)}
                </div>


                <div class="product-buttons">

                    <button
                        class="favorite"
                        onclick="favoriteProduct(${product.id})"
                    >
                        ♡
                    </button>


                    <button
                        class="cart-btn"
                        onclick="addToCart(${product.id})"
                    >
                        🛒
                    </button>


                    <button
                        class="buy-btn"
                        onclick="buyProduct(${product.id})"
                    >
                        View
                    </button>

                </div>

            </div>
        `;


        container.appendChild(card);

    });

}


/* =====================================
   CURRENCY CONVERSION
===================================== */

function convertPrice(
    price,
    fromCurrency,
    toCurrency
) {

    /*
       Convert first to SLE,
       then from SLE to selected currency.
    */

    const priceInSLE =
        price / currencyRates[fromCurrency];


    return priceInSLE *
        currencyRates[toCurrency];

}


/* =====================================
   CHANGE CURRENCY
===================================== */

function changeCurrency() {

    selectedCurrency =
        document
        .getElementById("currencySelector")
        .value;


    displayProducts();

    updateCart();

}


/* =====================================
   SEARCH
===================================== */

function searchProducts() {

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();


    const results =
        products.filter(product =>

            product.name
            .toLowerCase()
            .includes(search)

            ||

            product.category
            .toLowerCase()
            .includes(search)

            ||

            product.location
            .toLowerCase()
            .includes(search)

        );


    displayProducts(results);

}


/* =====================================
   CATEGORY
===================================== */

function filterProducts() {

    const category =
        document
        .getElementById("categoryFilter")
        .value;


    if (category === "all") {

        displayProducts();

        return;

    }


    const results =
        products.filter(
            product =>
            product.category === category
        );


    displayProducts(results);

}


/* =====================================
   ADD TO CART
===================================== */

function addToCart(id) {

    const product =
        products.find(
            p => p.id === id
        );


    if (!product) return;


    cart.push(product);


    localStorage.setItem(
        "sebaCart",
        JSON.stringify(cart)
    );


    updateCart();


    alert(
        product.name +
        " added to your cart."
    );

}


/* =====================================
   UPDATE CART
===================================== */

function updateCart() {

    document.getElementById("cartCount")
        .textContent = cart.length;


    const container =
        document.getElementById("cartItems");


    container.innerHTML = "";


    let total = 0;


    cart.forEach(
        (product, index) => {

            const converted =
                convertPrice(
                    product.price,
                    product.currency,
                    selectedCurrency
                );


            total += converted;


            container.innerHTML += `

                <div class="cart-item">

                    <img
                        src="${product.image}"
                        alt=""
                    >

                    <div class="cart-item-info">

                        <strong>
                            ${escapeHTML(product.name)}
                        </strong>

                        <br>

                        ${currencySymbols[selectedCurrency]}
                        ${converted.toFixed(2)}

                    </div>


                    <button
                        class="remove-cart"
                        onclick="removeCart(${index})"
                    >
                        ×
                    </button>

                </div>

            `;

        }
    );


    document.getElementById("cartTotal")
        .textContent =
        "Total: " +
        currencySymbols[selectedCurrency] +
        " " +
        total.toFixed(2);

}


/* =====================================
   REMOVE FROM CART
===================================== */

function removeCart(index) {

    cart.splice(index, 1);


    localStorage.setItem(
        "sebaCart",
        JSON.stringify(cart)
    );


    updateCart();

}


/* =====================================
   OPEN CART
===================================== */

function openCart() {

    document
        .getElementById("cartPanel")
        .classList.add("open");


    document
        .getElementById("overlay")
        .classList.add("show");


    updateCart();

}


/* =====================================
   CLOSE CART
===================================== */

function closeCart() {

    document
        .getElementById("cartPanel")
        .classList.remove("open");


    document
        .getElementById("overlay")
        .classList.remove("show");

}


/* =====================================
   BUY
===================================== */

function buyProduct(id) {

    const product =
        products.find(
            p => p.id === id
        );


    if (!product) return;


    alert(
        "Product: " +
        product.name +
        "\n\nSeller contact and checkout will be connected to Supabase next."
    );

}


/* =====================================
   FAVORITE
===================================== */

function favoriteProduct(id) {

    alert(
        "Product added to favorites."
    );

}


/* =====================================
   SELL FORM
===================================== */

function toggleSellForm() {

    document
        .getElementById("sellSection")
        .classList.toggle("active");

}


/* =====================================
   PUBLISH PRODUCT
===================================== */

function publishProduct() {

    const name =
        document
        .getElementById("productName")
        .value
        .trim();


    const category =
        document
        .getElementById("productCategory")
        .value;


    const price =
        Number(
            document
            .getElementById("productPrice")
            .value
        );


    const currency =
        document
        .getElementById("productCurrency")
        .value;


    const location =
        document
        .getElementById("productLocation")
        .value
        .trim();


    const image =
        document
        .getElementById("productImage")
        .value
        .trim();


    const description =
        document
        .getElementById("productDescription")
        .value
        .trim();


    if (
        !name ||
        !price ||
        !location
    ) {

        alert(
            "Please fill in the required fields."
        );

        return;

    }


    const newProduct = {

        id:
            Date.now(),

        name:
            name,

        category:
            category,

        price:
            price,

        currency:
            currency,

        location:
            location,

        image:
            image ||
            "https://via.placeholder.com/600x500?text=SeBa.sl",

        description:
            description

    };


    products.unshift(
        newProduct
    );


    displayProducts();


    alert(
        "Product added to marketplace."
    );


    document
        .getElementById("sellSection")
        .classList.remove("active");


}


/* =====================================
   NAVIGATION
===================================== */

function toggleNavigation() {

    const nav =
        document.getElementById("navigation");


    if (
        nav.style.display === "none"
    ) {

        nav.style.display = "flex";

    }

    else {

        nav.style.display = "flex";

    }

}


/* =====================================
   CHECKOUT
===================================== */

function checkout() {

    if (cart.length === 0) {

        alert(
            "Your cart is empty."
        );

        return;

    }


    alert(
        "Checkout system will be connected to your payment system."
    );

}


/* =====================================
   SECURITY
===================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =====================================
   START MARKETPLACE
===================================== */

displayProducts();

updateCart();

</script>
